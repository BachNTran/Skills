<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Wiki</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/assets/style.css">
<link rel="stylesheet" href="/assets/map.css">
<script src="/assets/vendor/marked.umd.js"></script>
<script src="/assets/vendor/purify.min.js"></script>
<script type="module" src="/assets/app.js"></script>
</head>
<body>
<a class="skip" href="#reader">Skip to content</a>
<aside id="side" aria-label="Files">
  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 2.5 20.5 7.4v9.2L12 21.5l-8.5-4.9V7.4z"/><path d="M12 12 3.5 7.4M12 12l8.5-4.6M12 12v9.5"/></svg>
      <div><p id="repo"></p><p id="counts"></p></div>
    </div>
    <label class="filter">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="m10.6 10.6 3.4 3.4"/></svg>
      <input id="filter" type="search" placeholder="Filter files" autocomplete="off" spellcheck="false" aria-label="Filter files">
      <kbd aria-hidden="true">/</kbd>
    </label>
  </header>
  <div id="tree" role="tree" aria-label="Repository files"></div>
</aside>
<div id="scrim" hidden></div>

<div id="app">
  <header id="top">
    <button id="files" class="icon" aria-label="Show files" aria-expanded="false">
      <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h8"/></svg>
    </button>
    <div id="views" role="radiogroup" aria-label="View">
      <button type="button" role="radio" aria-checked="true" data-view="read" aria-label="Read">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 3.2c2.2-.6 4.2-.4 6 .8 1.8-1.2 3.8-1.4 6-.8v9c-2.2-.6-4.2-.4-6 .8-1.8-1.2-3.8-1.4-6-.8zM8 4v9"/></svg>
        <span class="x">Read</span>
      </button>
      <button type="button" role="radio" aria-checked="false" data-view="graph2d" aria-label="Graph 2D">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="3.5" cy="4" r="1.8"/><circle cx="12.5" cy="5" r="1.8"/><circle cx="7" cy="12.5" r="1.8"/><path d="M5.3 4.2 10.7 4.8M4.3 5.7l2 5.2M11.5 6.5 8.2 11"/></svg>
        <span class="x">Graph 2D</span>
      </button>
      <button type="button" role="radio" aria-checked="false" data-view="graph3d" aria-label="Graph 3D">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 1.5 13.8 4.8v6.4L8 14.5l-5.8-3.3V4.8zM8 8 2.2 4.8M8 8l5.8-3.2M8 8v6.5"/></svg>
        <span class="x">Graph 3D</span>
      </button>
      <button type="button" role="radio" aria-checked="false" data-view="systems" aria-label="Systems" hidden>
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="1.5" y="2" width="5" height="4" rx="1"/><rect x="9.5" y="2" width="5" height="4" rx="1"/><rect x="5.5" y="10" width="5" height="4" rx="1"/><path d="M6.5 4h3M4 6v2.2c0 .6.4 1 1 1h1.2M12 6v2.2c0 .6-.4 1-1 1H9.8"/></svg>
        <span class="x">Systems</span>
      </button>
      <button type="button" role="radio" aria-checked="false" data-view="code" aria-label="Code" hidden>
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M5.2 4.5 1.8 8l3.4 3.5M10.8 4.5 14.2 8l-3.4 3.5M9.2 2.8 6.8 13.2"/></svg>
        <span class="x">Code</span>
      </button>
    </div>
  </header>

  <div id="stage">
    <section id="readview">
      <main id="reader" tabindex="-1">
        <article class="doc">
          <header id="r-head" hidden>
            <div class="titlerow">
              <h1 id="r-title"></h1>
              <div class="actions">
                <button id="fb-open" class="btn primary" type="button">
                  <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M2.5 3h11v7.5H7L4 13.2v-2.7H2.5z"/></svg>Feedback
                </button>
                <a id="r-raw" class="btn" target="_blank" rel="noopener noreferrer">
                  <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M9 2.5h4.5V7M13.5 2.5 7 9M11.5 9.5V13h-9V4H6"/></svg>Raw
                </a>
              </div>
            </div>
            <p id="r-meta"></p>
            <form id="fb" hidden>
              <div id="fb-kinds" role="radiogroup" aria-label="Kind of feedback"></div>
              <p id="fb-quote"></p>
              <textarea id="fb-text" maxlength="4000" placeholder="What should change?" aria-label="Feedback"></textarea>
              <div class="end">
                <button type="button" id="fb-cancel" class="btn">Cancel</button>
                <button type="submit" id="fb-send" class="btn primary">Send</button>
              </div>
            </form>
            <p id="fb-sent" aria-live="polite"></p>
          </header>
          <div id="r-body" class="md"></div>
        </article>
      </main>
      <nav id="outline" aria-label="On this page" hidden></nav>
    </section>

    <section id="graphview" hidden>
      <div id="graph" role="img" aria-label="Graph of the repository's documents. Click a node to read it."></div>
      <div id="legend"></div>
      <p id="hint"></p>
      <div id="gtools" role="toolbar" aria-label="Graph controls"></div>
      <p id="gload" role="status">Loading graph…</p>
    </section>

    <section id="mapview" hidden>
      <div id="map" role="application" aria-roledescription="diagram" aria-label="System map" tabindex="0"></div>
      <nav id="map-crumbs" aria-label="Map level"></nav>
      <div id="map-search" role="search"><input id="map-q" type="search" role="combobox" aria-label="Search the map" aria-autocomplete="list" aria-controls="map-results" aria-expanded="false" placeholder="Search map  /" autocomplete="off" spellcheck="false"><ul id="map-results" role="listbox" hidden></ul></div>
      <div id="map-tools" role="toolbar" aria-label="Map controls"></div>
      <div id="map-legend"></div>
      <canvas id="map-mini" width="168" height="112" aria-hidden="true"></canvas>
      <aside id="map-panel" aria-label="Details" hidden></aside>
      <div id="map-tip" role="tooltip" hidden></div>
      <ul id="map-a11y" class="sr-only" aria-label="Blocks on this level"></ul>
      <p id="map-status" class="sr-only" aria-live="polite"></p>
      <p id="map-empty" hidden></p>
      <p id="map-load" role="status" hidden>Loading map…</p>
    </section>

    <button id="pick" type="button" hidden></button>
  </div>
</div>
</body>
</html>
