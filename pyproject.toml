[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "modgate"
version = "0.1.0"
description = "Hash, detect, trace, record, report: the mechanics of gated module development with LLMs."
requires-python = ">=3.10"
dependencies = []  # zero runtime deps: PyYAML 6.0.3 (pure Python) is vendored in modgate/_vendor

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
modgate = "modgate.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"modgate._vendor" = ["LICENSE", "VENDORED.txt"]

[tool.pytest.ini_options]
testpaths = ["test"]
markers = ["req(id): the requirement a test proves"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["example", "src/modgate/_vendor"]
